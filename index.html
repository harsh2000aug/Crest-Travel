    <script>
      (function () {
        if (!/^\/blogs(?:\/|$)/.test(window.location.pathname)) return;
        var url = "https://backend.tripoairllc.com/blog";
        var request = {
          url: url,
          startedAt: Date.now(),
          promise: fetch(url)
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .catch(function () { return null; }),
        };
        window.__crestBlogPrefetch = request;
        window.setTimeout(function () {
          if (window.__crestBlogPrefetch === request) {
            delete window.__crestBlogPrefetch;
          }
        }, 30000);
      })();
    </script>
